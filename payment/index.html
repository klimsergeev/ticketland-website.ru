<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>Оплата — Ticketland</title>
    <link rel="stylesheet" href="../styles.css">
    <script src="../components/loader.js"></script>
</head>
<body>
    <!-- Header -->
    <div id="header-placeholder"></div>

    <!-- Main Content -->
    <main>
        <section class="placeholder-section">
            <div class="placeholder-content">
                <h1>Оплата</h1>
                <p>Страница оплаты в разработке</p>

                <div class="payment-methods">
                    <div class="payment-method">
                        <h3>СБП (Система быстрых платежей)</h3>
                        <p class="placeholder-note">Оплата через QR-код или приложение банка</p>
                        <div class="payment-placeholder-btn disabled">
                            <span>Оплатить через СБП</span>
                        </div>
                    </div>

                    <div class="payment-divider">
                        <span>или</span>
                    </div>

                    <div class="payment-method">
                        <h3>Банковская карта</h3>
                        <p class="placeholder-note">Visa, Mastercard, МИР</p>
                        <div class="card-form-placeholder">
                            <div class="card-input-placeholder">
                                <label>Номер карты</label>
                                <input type="text" placeholder="0000 0000 0000 0000" disabled>
                            </div>
                            <div class="card-row">
                                <div class="card-input-placeholder">
                                    <label>Срок действия</label>
                                    <input type="text" placeholder="MM/YY" disabled>
                                </div>
                                <div class="card-input-placeholder">
                                    <label>CVV</label>
                                    <input type="text" placeholder="***" disabled>
                                </div>
                            </div>
                        </div>
                        <div class="payment-placeholder-btn disabled">
                            <span>Оплатить картой</span>
                        </div>
                    </div>
                </div>

                <a href="../cart/" class="back-link">Вернуться в корзину</a>
            </div>
        </section>
    </main>

    <!-- Footer -->
    <div id="footer-placeholder"></div>
</body>
</html>
