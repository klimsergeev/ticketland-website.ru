<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>Спасибо за покупку — Ticketland</title>
    <link rel="stylesheet" href="../../styles.css">
    <script src="../../components/loader.js"></script>
</head>
<body>
    <!-- Header -->
    <div id="header-placeholder"></div>

    <!-- Main Content -->
    <main>
        <section class="placeholder-section">
            <div class="placeholder-content">
                <div class="order-success">
                    <div class="success-icon"></div>
                    <h1>Спасибо за покупку!</h1>
                    <p class="order-number">Заказ #12345</p>
                </div>

                <div class="order-details">
                    <h3>Детали заказа</h3>
                    <div class="order-info">
                        <div class="order-info-row">
                            <span class="label">Событие:</span>
                            <span class="value">«МАММА МИМО! или Мюзикл пошёл не так»</span>
                        </div>
                        <div class="order-info-row">
                            <span class="label">Дата:</span>
                            <span class="value">18 февраля 2026, 18:30</span>
                        </div>
                        <div class="order-info-row">
                            <span class="label">Место:</span>
                            <span class="value">Театр «Модерн», Партер, ряд 5, место 12</span>
                        </div>
                        <div class="order-info-row">
                            <span class="label">Стоимость:</span>
                            <span class="value">2 500 руб.</span>
                        </div>
                    </div>
                </div>

                <div class="order-actions">
                    <p class="placeholder-note">Билеты отправлены на вашу электронную почту</p>
                    <div class="order-buttons">
                        <div class="order-btn-placeholder">Скачать билеты (PDF)</div>
                        <div class="order-btn-placeholder secondary">Добавить в календарь</div>
                    </div>
                </div>

                <a href="/" class="back-link">На главную</a>
            </div>
        </section>
    </main>

    <!-- Footer -->
    <div id="footer-placeholder"></div>
</body>
</html>
