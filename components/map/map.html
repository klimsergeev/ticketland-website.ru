<div class="map-section">
    <div class="map-title">
        <h2 class="map-heading">Как добраться</h2>
        <p class="map-address"></p>
    </div>
    <div class="map-container">
        <img src="" alt="Карта" class="map-image">
        <button class="map-btn map-fullscreen" aria-label="Полноэкранный режим">
            <i class="icon icon-fullscreen"></i>
        </button>
        <div class="map-zoom-buttons">
            <button class="map-btn map-zoom-in" aria-label="Приблизить">
                <i class="icon icon-zoom-in"></i>
            </button>
            <button class="map-btn map-zoom-out" aria-label="Отдалить">
                <i class="icon icon-zoom-out"></i>
            </button>
        </div>
    </div>
</div>
