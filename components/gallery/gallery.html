<!-- Gallery -->
<div class="gallery">
    <div class="gallery-track" id="galleryTrack">
        <!-- Images will be dynamically inserted here -->
    </div>

    <!-- Navigation arrows -->
    <button class="gallery-nav-btn gallery-nav-prev" aria-label="Предыдущее фото">
        <i class="icon icon-chevron-left-24-outline"></i>
    </button>
    <button class="gallery-nav-btn gallery-nav-next" aria-label="Следующее фото">
        <i class="icon icon-chevron-right-24-outline"></i>
    </button>

    <!-- Action buttons -->
    <div class="gallery-actions">
        <button class="gallery-action-btn" aria-label="Добавить в избранное">
            <i class="icon icon-bookmark-24-outline"></i>
        </button>
        <button class="gallery-action-btn" aria-label="Поделиться">
            <i class="icon icon-share-android-24-outline"></i>
        </button>
    </div>
</div>
