<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>«МАММА МИМО! или Мюзикл пошёл не так» — Ticketland</title>
    <link rel="stylesheet" href="../../styles.css">
    <script src="../../components/loader.js"></script>
</head>
<body>
    <!-- Header -->
    <div id="header-placeholder"></div>

    <!-- Main Content -->
    <main>
        <!-- Gallery -->
        <div id="gallery-placeholder"></div>

        <!-- Event Title -->
        <div id="event-info-placeholder"></div>

        <!-- Timetable -->
        <div id="timetable-placeholder"></div>

        <!-- Event Description -->
        <div id="description-placeholder"></div>

        <!-- Persons -->
        <div id="persons-placeholder"></div>

        <!-- Reviews -->
        <section class="reviews-section">
            <div class="reviews-header">
                <h2>Отзывы зрителей</h2>
                <p class="reviews-subtitle">Оценить событие можно после посещения</p>
            </div>
            <div id="reviewsList" class="reviews-list"></div>
            <button class="read-all-reviews-btn">Читать все 895 отзывов</button>
        </section>

        <!-- Map -->
        <div id="map-placeholder"></div>

        <!-- Legal Info -->
        <div id="organizer-placeholder"></div>
    </main>

    <!-- Footer -->
    <div id="footer-placeholder"></div>

    <!-- Component JS files -->
    <script src="../../components/gallery/gallery.js"></script>
    <script src="../../components/timetable/timetable.js"></script>
    <script src="../../components/description/description.js"></script>
    <script src="../../components/persons/persons.js"></script>
    <script src="../../components/map/map.js"></script>

    <!-- Main script -->
    <script src="../../script.js"></script>
</body>
</html>
